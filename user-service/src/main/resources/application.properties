spring.application.name=user-service
server.port=8081

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ticket_user_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:ticket}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:change_me}
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true


# JWT CONFIG
# Key secret generate JwtSecret.generateNewSecret()
# expiration 3600 seconds equal 1 hour
jwt:
url: '/authorization'
header: 'Authorization'
prefix: 'Bearer '
expiration: 120
secret: ${JWT_SECRET:}
default-password: ${DEFAULT_PASSWORD:}
