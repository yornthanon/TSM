spring.application.name=user-service
server.port=8081

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ticket_user_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:ticket}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:ticket123}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true


# JWT CONFIG
# Key secret generate JwtSecret.generateNewSecret()
# expiration 3600 seconds equal 1 hour
jwt.url=/api/public/users/login
jwt.header=Authorization
jwt.prefix=Bearer 
jwt.expiration=3600
# refresh token expiration in milliseconds (default 1 hour = 3600000)
jwt.refresh-token-expiration=${JWT_REFRESH_TOKEN_EXPIRATION:3600000}
jwt.secret=${JWT_SECRET:}
default-password: ${DEFAULT_PASSWORD:}

# Default admin bootstrap (used only when the username does not exist yet)
default.admin.username=${DEFAULT_ADMIN_USERNAME:admin}
default.admin.password=${DEFAULT_ADMIN_PASSWORD:}
default.admin.email=${DEFAULT_ADMIN_EMAIL:admin@ticketmanagement.com}
