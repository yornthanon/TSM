spring.application.name=ticket-management
server.port=${PORT:8080}
server.forward-headers-strategy=framework
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# ---- Google OAuth2 (credentials are set only in the Render service environment) ----
google.oauth.client-id=${GOOGLE_CLIENT_ID:}
google.oauth.client-secret=${GOOGLE_CLIENT_SECRET:}
app.oauth2.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}
app.auth.platform-admin-emails=${PLATFORM_ADMIN_EMAILS:}

# ---- Database (single database shared by all modules) ----
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ticket_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:ticket}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=true
spring.jpa.show-sql=false

# ---- Flyway (unique global versions V1..V8, one shared history table) ----
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Render runs the monolith with Neon PostgreSQL only. Redis and Kafka are
# optional integrations here, so they must not keep the platform health check
# from completing when those services are not provisioned.
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.health.defaults.enabled=false
management.health.redis.enabled=false
management.health.kafka.enabled=false

# ---- Optional Redis (ticket holds use PostgreSQL row locks) ----
spring.data.redis.url=${REDIS_URL:redis://localhost:6379}

# ---- JWT (auth) ----
jwt.url=/api/public/users/login
jwt.header=Authorization
jwt.prefix=Bearer
jwt.expiration=3600
jwt.refresh-token-expiration=${JWT_REFRESH_TOKEN_EXPIRATION:3600000}
jwt.secret=${JWT_SECRET:}

# ---- Internal service-to-service calls (all modules run inside this app) ----
event.service.url=${EVENT_SERVICE_URL:http://localhost:8080/api/v1/events}
user.service.url=${USER_SERVICE_URL:http://localhost:8080}
payment.service.url=${PAYMENT_SERVICE_URL:http://localhost:8080/api/v1/payments}
ticket.service.url=${TICKET_SERVICE_URL:http://localhost:8080/api/v1/tickets}
internal.auth.token=${INTERNAL_AUTH_TOKEN:}

# ---- Kafka (order-confirmed events) ----
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
notification.topic.order-confirmed=order-confirmed-topic

# ---- SMTP (real email sending) ----
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.from=${MAIL_FROM:no-reply@ticketmanagement.com}
notification.email.retry.attempts=${EMAIL_RETRY_ATTEMPTS:3}
notification.email.retry.delay-ms=${EMAIL_RETRY_DELAY_MS:500}

# ---- Twilio (SMS) ----
twilio.account-sid=${TWILIO_ACCOUNT_SID:}
twilio.auth-token=${TWILIO_AUTH_TOKEN:}
twilio.phone-number=${TWILIO_PHONE_NUMBER:}
