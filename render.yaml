services:
  - type: web
    name: TSM
    env: docker
    region: oregon
    plan: free
    dockerfilePath: ./app-monolith/Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: APP_FRONTEND_URL
        value: https://tsm-frontend-1pxf.onrender.com
      - key: PLATFORM_ADMIN_EMAILS
        sync: false
      - key: INTERNAL_AUTH_TOKEN
        sync: false

  - type: web
    name: TSM-frontend
    env: static
    region: oregon
    plan: free
    rootDir: frontend-admindashboard
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://tsm-7hu8.onrender.com/api/v1
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
