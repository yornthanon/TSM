services:
  # PostgreSQL Database
  postgres:
    image: postgres:14
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ticket}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ticket123}
    ports:
      - "5432:5432"
    networks:
      - ticket-networks
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticket"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Redis (for ticket locking)
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    networks: [ticket-networks]
    volumes: [redisdata:/data]

  # Zookeeper (for Kafka)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports: ["2181:2181"]
    networks: [ticket-networks]

  # Kafka
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"
    networks: [ticket-networks]
    volumes: [kafka_data:/var/lib/kafka/data]

  # Zipkin (distributed tracing)
  zipkin:
    image: openzipkin/zipkin:latest
    container_name: zipkin
    environment:
      STORAGE_TYPE: mem
    ports: ["9411:9411"]
    networks: [ticket-networks]

  # Single monolith application (all modules combined)
  app:
    build:
      context: ../../
      dockerfile: app-monolith/Dockerfile
    container_name: app-monolith
    ports:
      - "8080:8080"
    env_file:
      - path: ../../.env
        required: false
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ticket_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-ticket}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-ticket123}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: ${JWT_SECRET:-change-this-local-secret-to-at-least-32-characters}
      DEFAULT_ADMIN_USERNAME: ${DEFAULT_ADMIN_USERNAME:-admin}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-admin123}
      DEFAULT_ADMIN_EMAIL: ${DEFAULT_ADMIN_EMAIL:-admin@ticketmanagement.com}
      # Map internal service names to hosted backend URLs
      # Format: internal-host:port=https://your-hosted-url.com
      # Example: user-service:8081=https://api.yourdomain.com/user-service,event-service:8082=https://api.yourdomain.com/event-service
      ROUTE_URI_HOST_MAP: ${ROUTE_URI_HOST_MAP:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_started
    networks: [ticket-networks]


networks:
  ticket-networks:
    driver: bridge

volumes:
  postgres_data:
  redisdata:
  kafka_data: