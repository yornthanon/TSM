services:
  # PostgreSQL Database
  postgres:
    image: postgres:14
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ticket}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the repository-root .env file}
    ports:
      - "5432:5432"
    networks:
      - ticket-networks
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticket"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Redis (for ticket locking)
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    networks: [ticket-networks]
    volumes: [redisdata:/data]

  # Kafka (KRaft mode - no ZooKeeper)
  # KRaft keeps the cluster ID in a single env var, so the broker can no longer
  # disagree with a metadata store about which cluster it belongs to. The
  # previous ZooKeeper-based setup crash-looped with InconsistentClusterIdException
  # / NodeExistsException on every restart.
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports: ["9092:9092"]
    networks: [ticket-networks]
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  # Zipkin (distributed tracing)
  zipkin:
    image: openzipkin/zipkin:latest
    container_name: zipkin
    environment:
      STORAGE_TYPE: mem
    ports: ["9411:9411"]
    networks: [ticket-networks]

  # Single monolith application (all modules combined)
  app:
    build:
      context: ../../
      dockerfile: app-monolith/Dockerfile
    container_name: app-monolith
    ports:
      - "8080:8080"
    env_file:
      - path: ../../.env
        required: false
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ticket_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-ticket}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the repository-root .env file}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # Must be Base64 decoding to 32-64 bytes, or every auth call returns 500.
      # Generate a real one with: openssl rand -base64 32
      JWT_SECRET: ${JWT_SECRET:?Set a Base64-encoded JWT_SECRET in the repository-root .env file}
      # Map internal service names to hosted backend URLs
      # Format: internal-host:port=https://your-hosted-url.com
      # Example: user-service:8081=https://api.yourdomain.com/user-service,event-service:8082=https://api.yourdomain.com/event-service
      ROUTE_URI_HOST_MAP: ${ROUTE_URI_HOST_MAP:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_started
    networks: [ticket-networks]


networks:
  ticket-networks:
    driver: bridge

volumes:
  postgres_data:
  redisdata:
  kafka_data:
