# Optional frontend overlay. The original docker-compose.yaml is unchanged.
# Usage:
#   VITE_API_BASE_URL=https://api.example.com docker compose \
#     -f docker-compose.yaml -f docker-compose.frontend.yaml up --build
services:
  admin-dashboard:
    build:
      context: ../../
      dockerfile: admin-dashboard-service/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
        VITE_API_MODE: ${VITE_API_MODE:-live}
    container_name: admin-dashboard
    ports:
      - "${FRONTEND_PORT:-8090}:80"
    restart: unless-stopped
