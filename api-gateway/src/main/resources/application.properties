spring.application.name=api-gateway
server.port=8080

# R2DBC (dynamic routes)
spring.r2dbc.url=${SPRING_DATASOURCE_URL:r2dbc:postgresql://localhost:5432/ticket_gateway_db}
spring.r2dbc.username=${SPRING_DATASOURCE_USERNAME:ticket}
spring.r2dbc.password=${SPRING_DATASOURCE_PASSWORD:ticket123}

# Redis (rate limiting)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# JWT (verify tokens)
jwt.header=Authorization
jwt.prefix=Bearer
jwt.secret=${JWT_SECRET:wM0mBxIDFKh1FOCWfA++ZCSk8d1I8ztVZAOxdqxtiXxOmb8yF9UCwIZ8MMCGHptU}
jwt.public-paths=/api/public/**


gateway:
logging:
enabled: true
level: INFO
log-request-body: false
log-response-body: true
log-headers: true
mask-sensitive-headers: true
sensitive-headers:
- authorization
- x-api-key
- x-auth-token
- cookie
- set-cookie
- x-forwarded-for
- x-real-ip
- password
sensitive-fields:
- password
- token
- secret
- key
- credential
max-body-length: 1000
log-performance: true
log-error-stack-traces: true
include-request-id: true
log-request-metrics: true
excluded-paths:
- /health
- /actuator/health
- /actuator/info
enable-correlation-id: true
correlation-id-header: X-Correlation-ID
log-user-agent: true
log-client-ip: true
log-request-size: true
log-response-size: true
service-name: api-gateway

# User service configuration
user:
service:
url: ${USER_SERVICE_URL:http://localhost:8081}